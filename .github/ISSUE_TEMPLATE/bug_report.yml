name: Bug report / 问题反馈
description: Report a reproducible problem / 报告可复现的问题
body:
  - type: input
    id: version
    attributes:
      label: Application and Windows version / 应用与系统版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Remove personal paths, secrets and private configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true

